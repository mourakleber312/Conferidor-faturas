name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-36" \
          "build-tools;36.0.0"

      - name: Criar projeto Flutter Android
        run: |
          flutter create \
            --platforms=android \
            --org br.com.conferidorfaturas \
            .

      - name: Configurar compileSdk 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

      - name: Baixar dependencias
        run: flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ConferidorFaturas-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
