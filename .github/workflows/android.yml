name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar projeto Flutter Android
        run: |
          mkdir temp
          cd temp
          flutter create --platforms=android --org br.com.conferidorfaturas conferidor_faturas
          cp -r conferidor_faturas/android ../android

      - name: Dependencias
        run: flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ConferidorFaturas-APK
          path: build/app/outputs/flutter-apk/app-release.apk
